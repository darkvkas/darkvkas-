
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARKVKAS | Official</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#08080d;
  color:white;
  font-family:Arial,sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:22px;
}
.container{
  width:100%;max-width:430px;
  background:linear-gradient(145deg,#171323,#0c0c13);
  border:1px solid #38245a;
  border-radius:24px;
  padding:32px 24px;
  text-align:center;
  box-shadow:0 0 45px #7025b533;
}
.logo{
  font-size:36px;font-weight:900;
  letter-spacing:3px;
  background:linear-gradient(90deg,#fff,#a66bff);
  color:transparent;
  background-clip:text;
  margin-bottom:12px;
}
.tag{color:#aaa;font-size:13px;letter-spacing:3px}
.line{
  width:65px;height:3px;
  background:#a855f7;
  margin:24px auto;
  border-radius:10px;
}
h1{font-size:25px;margin-bottom:12px}
p{color:#aaa;line-height:1.7;font-size:14px}
input,textarea{
  width:100%;margin-top:15px;
  padding:14px;border-radius:12px;
  border:1px solid #49335f;
  background:#101019;color:white;
  font-size:15px;outline:none;
}
textarea{height:100px;resize:vertical}
button{
  width:100%;padding:15px;
  margin-top:17px;border:0;
  border-radius:12px;
  background:linear-gradient(90deg,#7928ca,#b34cff);
  color:white;font-weight:bold;
  font-size:15px;cursor:pointer;
}
button:active{opacity:.8}
.footer{margin-top:25px;color:#777;font-size:12px}
</style>
</head>
<body>
<div class="container">
  <div class="logo">DARKVKAS</div>
  <div class="tag">WELCOME TO MY WORLD</div>
  <div class="line"></div>

  <h1>Welcome 👑</h1>
  <p>
    A new identity. A different vibe.<br>
    Welcome to the official DARKVKAS website.
  </p>

  <div class="line"></div>

  <h1>Get In Touch</h1>
  <p>Have something to say? Send me a message.</p>

  <input id="name" type="text"
  placeholder="Your Name">

  <textarea id="message"
  placeholder="Write your message..."></textarea>

  <button onclick="sendMessage()">
    SEND MESSAGE ↗
  </button>

  <div class="footer">
    © 2026 DARKVKAS | All Rights Reserved
  </div>
</div>

<script>
function sendMessage(){
  const name=document.getElementById("name").value.trim();
  const message=document.getElementById("message").value.trim();

  if(!name || !message){
    alert("Please enter your name and message.");
    return;
  }

  const text="Hello DARKVKAS!\nName: "+name+
  "\nMessage: "+message;

  const url="https://wa.me/919616030520?text="+
  encodeURIComponent(text);

  window.open(url,"_blank");
}
</script>
</body>
</html>
